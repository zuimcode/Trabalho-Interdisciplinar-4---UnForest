name: UnForest
description: "A fun educational game about environmental awareness and sustainability."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bonfire: ^3.17.2
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Força o projeto a utilizar o Flame 1.37.0 compatível com o Bonfire 3.17.2
dependency_overrides:
  flame: 1.37.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/maps/
    - assets/images/tiled/ERW-Grassland 2.0/Props/Static props/sheet1-sprites/
    - assets/images/tiled/EPIC RPG World Pack Grass/Tilesets and props/
    - assets/images/characters/
    - assets/images/buttons/
    - assets/videos/